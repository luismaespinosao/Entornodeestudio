<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entorno de Estudio P3 — UTM</title>
  <!-- Usamos la versión estable más reciente para soporte de Passthrough en Quest 3S -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;700&display=swap');

    :root { --cyan: #00e6ff; --glass: rgba(6, 12, 30, 0.85); }

    /* HUD para Realidad Mixta */
    #ar-hud {
      position: fixed; inset: 0; pointer-events: none;
      display: none; font-family: 'Outfit', sans-serif; z-index: 10;
    }

    #hud-container {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      background: var(--glass); border: 1px solid var(--cyan);
      padding: 15px 40px; border-radius: 50px; text-align: center;
      box-shadow: 0 0 20px rgba(0, 230, 255, 0.2);
    }

    #timer {
      font-family: 'Share Tech Mono', monospace; font-size: 3rem;
      color: #fff; text-shadow: 0 0 10px var(--cyan);
    }

    .badge {
      font-size: 10px; color: var(--cyan); letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <!-- Capa de interfaz de usuario (DOM Overlay) -->
  <div id="ar-hud">
    <div id="hud-container">
      <div class="badge">Sesión de Enfoque Activa</div>
      <div id="timer">25:00</div>
    </div>
  </div>

  <!-- Escena A-Frame configurada para Meta Quest 3S -->
  <a-scene 
    webxr="optionalFeatures: passthrough, dom-overlay; overlayElement: #ar-hud"
    renderer="alpha: true; colorManagement: true;"
    background="transparent: true">

    <a-assets>
      <!-- Aquí cargarás tu modelo .glb del robot más adelante -->
      <img id="asistente-img" src="https://cdn.glitch.global/60d0e6ff-4860-40c0-b0d4-ffcc88443355/astronauta.png?v=1">
    </a-assets>

    <!-- Contenido Holográfico (Asistente) -->
    <a-entity id="anchor-asistente" position="-0.5 1.1 -0.7">
      <a-image src="#asistente-img" width="0.25" height="0.25"></a-image>
      <!-- Aura de estado animada -->
      <a-torus radius="0.1" radius-tubular="0.005" rotation="90 0 0" color="#00e6ff"
               animation="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dir: alternate; dur: 2000; loop: true">
      </a-torus>
    </a-entity>

    <!-- Iluminación para integrar los hologramas -->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>

    <!-- Cámara optimizada para AR -->
    <a-camera position="0 1.6 0">
      <a-cursor color="#00e6ff" scale="0.5 0.5 0.5"></a-cursor>
    </a-camera>

    <!-- Entorno virtual que solo se ve fuera de AR -->
    <a-sky id="sky-vr" color="#050505"></a-sky>

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const hud = document.getElementById('ar-hud');
    const sky = document.getElementById('sky-vr');

    // Gestión automática del Passthrough en Quest 3S
    sceneEl.addEventListener('enter-vr', () => {
      if (sceneEl.is('ar-mode')) {
        hud.style.display = 'block';
        sky.setAttribute('visible', 'false'); // Apaga el fondo negro para ver tu habitación
        console.log("Iniciando Realidad Mixta: Passthrough activado.");
      }
    });

    sceneEl.addEventListener('exit-vr', () => {
      hud.style.display = 'none';
      sky.setAttribute('visible', 'true');
    });

    // Lógica del Timer (Pomodoro)
    let seconds = 25 * 60;
    const timerDisplay = document.getElementById('timer');

    setInterval(() => {
      if (sceneEl.is('ar-mode') && seconds > 0) {
        seconds--;
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${m}:${s}`;
      }
    }, 1000);
  </script>
</body>
</html>
